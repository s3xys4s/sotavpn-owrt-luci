name: OpenWrt packages

on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false

      - name: Test both controller builds
        run: |
          go test ./cmd/... ./internal/...
          go test -tags=luci_only ./cmd/... ./internal/...

      - name: Install SDK host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison gawk gettext \
            libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file curl openssl zstd xz-utils perl time

      - name: Build ARM64 controller and verify the upstream engine
        run: |
          url=https://github.com/sotavpn/sotavpn-app/releases/download/v1.8.11/sotaconnect_arm64.deb
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/sota.deb"
          python3 tools/extract.py "$RUNNER_TEMP/sota.deb" build/arm64 --source "$url" \
            --sha256 44ec209c690ed718879486341529dd89e01b3783790b306c2b5cfe7681ecedbd --version '1.8.11+1892' --arch arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags=luci_only -trimpath \
            -ldflags='-s -w' -o build/openwrt-controller-arm64 ./cmd/panel

      - name: Build IPKs for OpenWrt 24.10.8
        run: |
          sdk=$(sh tools/prepare_filogic_sdk.sh 24.10.8 "$RUNNER_TEMP/openwrt")
          sh tools/build_openwrt.sh "$sdk" build/candidate-filogic-24.10.8

      - name: Prepare the APK SDK
        run: |
          sdk=$(sh tools/prepare_filogic_sdk.sh 25.12.6 "$RUNNER_TEMP/openwrt")
          echo "APK_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Load the release signing key
        if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref == 'refs/heads/master')
        env:
          SOTA_APK_SIGNING_KEY: ${{ secrets.SOTA_APK_SIGNING_KEY }}
        run: |
          : "${SOTA_APK_SIGNING_KEY:?Set the SOTA_APK_SIGNING_KEY repository secret}"
          umask 077
          printf '%s\n' "$SOTA_APK_SIGNING_KEY" > "$APK_SDK/private-key.pem"
          unset SOTA_APK_SIGNING_KEY
          openssl pkey -in "$APK_SDK/private-key.pem" -pubout -out "$APK_SDK/public-key.pem"
      - name: Build and verify signed APKs for OpenWrt 25.12.6
        run: |
          trap 'rm -f "$APK_SDK/private-key.pem"' EXIT
          sh tools/build_openwrt.sh "$APK_SDK" build/candidate-filogic-25.12.6

      - name: Package and verify install bundles
        shell: pwsh
        run: ./tools/bundle-routerich.ps1

      - name: Collect release files
        run: |
          mkdir dist
          cp build/candidate-filogic-24.10.8/*.ipk build/candidate-filogic-25.12.6/*.apk \
            build/candidate-filogic-25.12.6/sota-lab.pem build/release/routerich-ax3000/*.zip dist/
          cd dist
          sha256sum -- *.ipk *.apk *.pem *.zip > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-release
          path: dist/
          if-no-files-found: error

  regression:
    name: Regression / OpenWrt ${{ matrix.openwrt }}
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        openwrt: ['24.10.8', '25.12.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwrt-release
          path: dist
      - name: Install host test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends squashfs-tools nftables iproute2
      - name: Exercise the installed packages on the Routerich filesystem
        env:
          OPENWRT: ${{ matrix.openwrt }}
        run: sudo bash tools/ci/test-openwrt-packages.sh "$OPENWRT" dist

  publish:
    needs: [build, regression]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwrt-release
          path: dist

      - name: Publish verified packages for this tag
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c SHA256SUMS
          files=(*)
          if ! release=$(gh release view --json isDraft,assets -- "$TAG"); then
            gh release create --draft --verify-tag --generate-notes --title "$TAG" -- "$TAG"
            release='{"isDraft":true}'
          fi
          if jq -e '.isDraft' <<< "$release" >/dev/null; then
            gh release upload --clobber -- "$TAG" "${files[@]}"
            gh release edit --draft=false -- "$TAG"
          else
            # A release can already exist when its tag was created in the GitHub UI.
            missing=()
            for file in "${files[@]}"; do
              if ! jq -e --arg name "$file" 'any(.assets[]; .name == $name)' <<< "$release" >/dev/null; then
                missing+=("$file")
              fi
            done
            if (( ${#missing[@]} )); then
              for file in "${files[@]}"; do
                digest=$(jq -r --arg name "$file" '.assets[] | select(.name == $name) | .digest' <<< "$release")
                if [[ -n "$digest" && "$digest" != "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]]; then
                  echo "::error::Published $file differs from this build; use a new tag."
                  exit 1
                fi
              done
              gh release upload -- "$TAG" "${missing[@]}"
            fi
          fi
